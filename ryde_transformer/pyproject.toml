[project]
name = "ryde-transformer"
version = "0.1.0"
description = "Transform raw parquet data to claned data ready to be loaded"
authors = [
    {name = "pandelis-giankulidis",email = "pantelis.giankoulidis+1@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.143.5,<0.144.0)",
    "logging (>=0.4.9.6,<0.5.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "polars (>=2.0.0,<3.0.0)",
    "pyarrow (>=26.0.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
