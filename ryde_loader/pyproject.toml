[project]
name = "ryde-loader"
version = "0.1.0"
description = "Load Parquet data to MS-SQL database ETL pipeline"
authors = [
    {name = "pandelis-giankulidis",email = "pantelis.giankoulidis+1@gmail.com"}
]
requires-python = ">=3.14"
dependencies = [
    "pyarrow (>=25.0.1,<26.0.0)",
    "pyodbc (>=5.3.0,<6.0.0)",
    "polars (>=1.44.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
